[project]
name = "tts-to-mp3"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shobhit Parvan", email = "shobhit.parvan@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "gtts>=2.5.4",
    "pydub>=0.25.1",
    "pypdf2>=3.0.1",
    "pyttsx3>=2.99",
]

[project.scripts]
tts-to-mp3 = "tts_to_mp3:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
